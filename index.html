<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Spend Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@300;400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:       #F5F0E8;
      --cream-dark:  #EDE6D6;
      --ink:         #1A1A1A;
      --ink-light:   #4A4A4A;
      --ink-muted:   #8A8A8A;
      --forest:      #1C4532;
      --forest-mid:  #276146;
      --forest-light:#3A8C62;
      --terra:       #C85B3A;
      --terra-light: #E8745A;
      --gold:        #C9922A;
      --white:       #FFFFFF;
      --shadow-sm:   0 1px 4px rgba(0,0,0,0.08);
      --shadow-md:   0 4px 16px rgba(0,0,0,0.10);
      --shadow-lg:   0 8px 32px rgba(0,0,0,0.12);
      --radius:      10px;
      --radius-lg:   16px;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ─── BACKGROUND TEXTURE ─────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(28,69,50,0.04) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(200,91,58,0.04) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ─── HEADER ─────────────────────────────────── */
    header {
      background: var(--forest);
      color: var(--white);
      padding: 28px 24px 24px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 24px rgba(28,69,50,0.25);
    }
    .header-inner {
      max-width: 640px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
    }
    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem; font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }
    .brand p {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; font-weight: 300;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .currency-wrap {
      display: flex; align-items: center; gap: 8px;
    }
    .currency-wrap label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.55);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #currency {
      background: rgba(255,255,255,0.12);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      cursor: pointer;
      outline: none;
      transition: background 0.2s;
    }
    #currency option { background: var(--forest); }
    #currency:hover { background: rgba(255,255,255,0.2); }

    /* ─── METRICS STRIP ──────────────────────────── */
    .metrics-strip {
      background: var(--forest-mid);
      padding: 12px 24px 14px;
    }
    .metrics-inner {
      max-width: 640px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 0; text-align: center;
    }
    .metrics-row-divider {
      grid-column: 1 / -1;
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 6px 0;
    }
    .metric-card {
      padding: 8px 4px;
      position: relative;
    }
    .metric-card + .metric-card::before {
      content: '';
      position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: rgba(255,255,255,0.1);
    }
    .metric-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 3px;
    }
    .metric-value {
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--white);
      letter-spacing: -0.01em;
    }
    .metric-card.accent  .metric-value { color: #7ED4A4; }
    .metric-card.terra   .metric-value { color: #F5A082; }
    .metric-card.gold    .metric-value { color: #F5C97A; }
    .metric-card.muted   .metric-value { color: rgba(255,255,255,0.7); }
    .metric-card.bright  .metric-value { color: #A8D8FF; }

    /* ─── MAIN CONTENT ───────────────────────────── */
    main {
      max-width: 640px; margin: 0 auto;
      padding: 24px 20px 0;
      position: relative; z-index: 1;
    }

    /* ─── FORM CARD ──────────────────────────────── */
    .form-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 24px;
      margin-bottom: 28px;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .form-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--forest);
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }
    .form-card h2 i { font-size: 0.85rem; opacity: 0.6; }

    .form-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 12px;
    }
    .form-full { margin-bottom: 12px; }

    .field-wrap { display: flex; flex-direction: column; gap: 5px; }
    .field-wrap label {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .field-wrap input,
    .field-wrap select {
      padding: 9px 12px;
      border: 1.5px solid var(--cream-dark);
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .field-wrap input:focus,
    .field-wrap select:focus {
      border-color: var(--forest-light);
      box-shadow: 0 0 0 3px rgba(58,140,98,0.12);
      background: var(--white);
    }
    .field-wrap input[type="number"] { font-size: 0.9rem; }
    #amount { font-size: 1.05rem; letter-spacing: 0.02em; }

    .payment-group {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 16px;
    }
    .pay-btn {
      padding: 9px 12px;
      border: 1.5px solid var(--cream-dark);
      border-radius: 8px;
      background: var(--cream);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--ink-light);
      cursor: pointer;
      display: flex; align-items: center;
      justify-content: center; gap: 6px;
      transition: all 0.2s;
      outline: none;
    }
    .pay-btn:hover { border-color: var(--forest-light); color: var(--forest); }
    .pay-btn.active {
      background: var(--forest);
      border-color: var(--forest);
      color: var(--white);
      box-shadow: 0 2px 8px rgba(28,69,50,0.2);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--forest);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-family: 'Lato', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      display: flex; align-items: center;
      justify-content: center; gap: 8px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }
    .submit-btn:hover {
      background: var(--forest-light);
      box-shadow: 0 4px 16px rgba(28,69,50,0.25);
    }
    .submit-btn:active { transform: scale(0.99); }

    /* ─── ENTRIES SECTION ────────────────────────── */
    .entries-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .entries-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--ink);
    }
    .entry-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      background: var(--cream-dark);
      color: var(--ink-muted);
      padding: 3px 8px; border-radius: 20px;
      letter-spacing: 0.06em;
    }

    /* ─── DATE GROUP ─────────────────────────────── */
    .date-group { margin-bottom: 20px; }
    .date-group-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.63rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 8px;
      padding: 0 2px;
      display: flex; align-items: center; gap: 8px;
    }
    .date-group-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--cream-dark);
    }
    .date-group-total {
      font-family: 'DM Mono', monospace;
      color: var(--ink-light);
      letter-spacing: 0.04em;
      order: 3;
    }

    /* ─── ENTRY ITEM ─────────────────────────────── */
    .entry-item {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 13px 16px;
      margin-bottom: 8px;
      display: flex; align-items: center;
      gap: 12px;
      border: 1px solid rgba(0,0,0,0.05);
      transition: box-shadow 0.2s, transform 0.15s;
      animation: slideIn 0.3s ease;
      position: relative;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .entry-item:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .pay-badge {
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, box-shadow 0.15s;
      width: 34px; height: 34px;
      border-radius: 8px;
      display: flex; align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .pay-badge.cash {
      background: rgba(201,146,42,0.12);
      color: var(--gold);
    }
    .pay-badge.upi {
      background: rgba(28,69,50,0.1);
      color: var(--forest);
    }
    .pay-badge:hover {
      transform: scale(1.06);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .badge-swap {
      position: absolute;
      right: -3px; bottom: -3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--white);
      border: 1px solid var(--cream-dark);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.4rem;
      color: var(--ink-muted);
      pointer-events: none;
    }
    .pay-badge:hover .badge-swap { color: var(--forest); border-color: var(--forest-light); }

    .entry-body { flex: 1; min-width: 0; }
    .entry-desc {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-meta {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .entry-amount {
      font-family: 'DM Mono', monospace;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--terra);
      flex-shrink: 0;
    }

    .delete-btn {
      width: 28px; height: 28px;
      border: none; background: none;
      color: var(--ink-muted);
      cursor: pointer;
      border-radius: 6px;
      display: flex; align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      flex-shrink: 0;
      transition: all 0.2s;
      opacity: 0;
    }
    .entry-item:hover .delete-btn,
    .delete-btn:focus-visible { opacity: 1; }
    .delete-btn:hover {
      background: #FEE2E2;
      color: #DC2626;
    }

    /* ─── INLINE EDITING ─────────────────────────── */
    .editable-field {
      cursor: text;
      border-radius: 4px;
      padding: 1px 4px;
      margin: -1px -4px;
      transition: background 0.15s, outline 0.15s;
      display: inline-block;
      min-width: 20px;
    }
    .editable-field:hover {
      background: rgba(58,140,98,0.08);
    }
    .editable-field:focus {
      outline: 1.5px solid var(--forest-light);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(58,140,98,0.12);
    }
    /* Special: amount field */
    .editable-amount {
      color: var(--terra);
      font-family: 'DM Mono', monospace;
      font-size: 0.92rem;
      font-weight: 500;
      min-width: 48px;
      text-align: right;
    }
    /* Special: time field */
    .editable-time {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--ink-muted);
    }
    /* Edit pencil hint */
    .edit-hint {
      font-size: 0.52rem;
      color: var(--forest-light);
      margin-left: 4px;
      opacity: 0;
      transition: opacity 0.2s;
      vertical-align: middle;
    }
    .entry-item:hover .edit-hint { opacity: 0.6; }

    /* ─── FILTER BAR ─────────────────────────────── */
    .filter-bar {
      display: flex; gap: 8px;
      margin-bottom: 16px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--cream-dark);
      background: var(--white);
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: var(--ink-light);
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--forest-light); color: var(--forest); }
    .filter-btn.active-all {
      background: var(--forest);
      border-color: var(--forest);
      color: var(--white);
    }
    .filter-btn.active-cash {
      background: rgba(201,146,42,0.12);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 700;
    }
    .filter-btn.active-upi {
      background: rgba(28,69,50,0.1);
      border-color: var(--forest);
      color: var(--forest);
      font-weight: 700;
    }
    .filter-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-all  { background: var(--white); border: 1.5px solid rgba(255,255,255,0.6); }
    .dot-cash { background: var(--gold); }
    .dot-upi  { background: var(--forest-light); }

    /* ─── FILTER SUMMARY PANEL ───────────────────── */
    .filter-summary {
      display: none;
      margin-top: 24px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      animation: slideIn 0.3s ease;
    }
    .filter-summary.visible { display: block; }

    .fs-header {
      padding: 14px 20px 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .fs-header.cash-theme { background: var(--gold); }
    .fs-header.upi-theme  { background: var(--forest); }

    .fs-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: var(--white); flex-shrink: 0;
    }
    .fs-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem; font-weight: 600;
      color: var(--white);
    }
    .fs-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .fs-body {
      background: var(--white);
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      border: 1px solid rgba(0,0,0,0.06);
      border-top: none;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    .fs-stat {
      text-align: center;
      padding: 8px 4px;
    }
    .fs-stat + .fs-stat {
      border-left: 1px solid var(--cream-dark);
    }
    .fs-stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ink);
    }
    .fs-stat-value.highlight-cash { color: var(--gold); }
    .fs-stat-value.highlight-upi  { color: var(--forest); }
    .fs-stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 3px;
    }

    /* ─── EMPTY STATE ────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
    }
    .empty-icon {
      font-size: 2.5rem;
      color: var(--cream-dark);
      margin-bottom: 16px;
    }
    .empty-state p {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }
    .empty-state span {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--ink-muted);
      opacity: 0.6;
    }

    /* ─── EXPORT / IMPORT TOOLBAR ────────────────── */
    .data-toolbar {
      display: flex; gap: 8px; flex-wrap: wrap;
      background: var(--white);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      align-items: center;
    }
    .toolbar-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-right: 4px;
      flex-shrink: 0;
    }
    .toolbar-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1.5px solid var(--cream-dark);
      background: var(--cream);
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      color: var(--ink-light);
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .toolbar-btn:hover {
      border-color: var(--forest-light);
      color: var(--forest);
      background: rgba(58,140,98,0.06);
    }
    .toolbar-btn.import-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,146,42,0.06);
    }
    .toolbar-btn.undo-btn {
      border-color: var(--terra);
      color: var(--terra);
      background: rgba(200,91,58,0.06);
    }
    .toolbar-btn.undo-btn:hover {
      border-color: var(--terra);
      color: var(--white);
      background: var(--terra);
    }
    .toolbar-btn[hidden] { display: none; }
    .toolbar-divider {
      width: 1px; height: 20px;
      background: var(--cream-dark);
      margin: 0 4px; flex-shrink: 0;
    }
    #importFileInput { display: none; }

    /* ─── IMPORT REPORT ──────────────────────────── */
    .import-report {
      background: var(--white);
      border: 1px solid rgba(0,0,0,0.06);
      border-left: 3px solid var(--forest-light);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      animation: slideIn 0.3s ease;
    }
    .import-report[hidden] { display: none; }
    .import-report.warn { border-left-color: var(--terra); }
    .ir-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      color: var(--ink);
      margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .ir-close {
      border: none; background: none; cursor: pointer;
      color: var(--ink-muted); font-size: 0.75rem;
      padding: 4px; border-radius: 4px;
    }
    .ir-close:hover { color: var(--ink); background: var(--cream); }
    .ir-line {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--ink-light);
      line-height: 1.7;
    }
    .ir-line b { color: var(--forest); font-weight: 500; }
    .ir-line.skip b { color: var(--gold); }
    .ir-line.bad  b { color: var(--terra); }
    .ir-detail {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      color: var(--ink-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--cream-dark);
      line-height: 1.6;
      max-height: 96px;
      overflow-y: auto;
    }

    /* ─── DROP ZONE STATE ────────────────────────── */
    body.dropping::after {
      content: 'Drop a JSON or CSV file to import';
      position: fixed; inset: 12px;
      border: 2px dashed var(--forest-light);
      border-radius: var(--radius-lg);
      background: rgba(245,240,232,0.92);
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      color: var(--forest);
      z-index: 900;
      pointer-events: none;
    }

    /* ─── STATEMENT OVERLAY ──────────────────────── */
    .stmt-overlay {
      position: fixed; inset: 0;
      background: var(--cream);
      z-index: 800;
      display: flex; flex-direction: column;
    }
    .stmt-overlay[hidden] { display: none; }
    .stmt-bar {
      background: var(--forest);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      box-shadow: 0 2px 12px rgba(28,69,50,0.25);
      flex-shrink: 0;
    }
    .stmt-bar-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      flex: 1; text-align: center;
    }
    .stmt-act {
      padding: 7px 12px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      color: var(--white);
      font-family: 'DM Mono', monospace; font-size: 0.68rem;
      letter-spacing: 0.05em; cursor: pointer;
      display: flex; align-items: center; gap: 6px;

    .stmt-act.primary { background: var(--white); color: var(--forest); border-color: var(--white); font-weight: 500; }
    .stmt-scroll { flex: 1; overflow-y: auto; padding: 20px 12px 48px; }

    @media print {
      body > *:not(.stmt-overlay) { display: none !important; }
      body { background: #fff; padding: 0; }
      body::before { display: none; }
      .stmt-overlay { position: static; background: #fff; }
      .stmt-bar { display: none !important; }
      .stmt-scroll { overflow: visible; padding: 0; }
      .stmt-day { break-inside: avoid; }
    }


    /* ─── TOAST ──────────────────────────────────── */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      padding: 10px 20px;
      border-radius: 24px;
      font-family: 'DM Mono', monospace;
      font-size: 0.76rem;
      letter-spacing: 0.04em;
      color: var(--white);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.success { background: var(--forest); }
    #toast.error   { background: var(--terra); }

    /* ─── ACCESSIBILITY ──────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--forest-light);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ─── RESPONSIVE ─────────────────────────────── */
    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .metrics-inner { grid-template-columns: 1fr 1fr 1fr; }
      .metric-value { font-size: 0.72rem; }
      .metric-label { font-size: 0.5rem; }
      .delete-btn { opacity: 1; }
      .edit-hint { opacity: 0.5; }
    }
  </style>
</head>
<body>

        <div>
          <div class="fs-title" id="fsTitle">Cash</div>

        </div>
      </div>

        <div class="fs-stat">
          <div class="fs-stat-value" id="fsTotal">—</div>
          <div class="fs-stat-label">Total</div>

          <div class="fs-stat-value" id="fsCount">—</div>

        </div>

  </main>

  <div class="stmt-overlay" id="stmtOverlay" hidden>
    <div class="stmt-bar">
      <button type="button" class="stmt-act" id="stmtClose"><i class="fa-solid fa-xmark"></i> Close</button>
      <span class="stmt-bar-label" id="stmtScope">Preview</span>
      <button type="button" class="stmt-act" id="stmtDownload"><i class="fa-solid fa-download"></i> Download page</button>
      <button type="button" class="stmt-act primary" id="stmtPrint"><i class="fa-solid fa-file-pdf"></i> Print / Save as PDF</button>
    </div>
    <div class="stmt-scroll"><div class="stmt-page" id="stmtPage"></div></div>
  </div>

  <div id="toast"></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   STORAGE — unchanged on purpose.
   Keys:  'spends'   → array of entries
          'currency' → 'INR' | 'USD' | 'EUR'
   Entry: { date:'YYYY-MM-DD', time:'HH:MM', amount:Number,
            description:String, payment:'cash'|'upi' }
   ══════════════════════════════════════════════════════════ */
const KEY_ENTRIES = 'spends';
const KEY_CURRENCY = 'currency';

const SYMBOL = { INR:'₹', USD:'$', EUR:'€' };
const LOCALE = { INR:'en-IN', USD:'en-US', EUR:'de-DE' };

let entries  = [];
let currency = 'INR';
let filter   = 'all';
let payment  = 'upi';
let undoState = null;   // snapshot taken immediately before an import

const $ = s => document.querySelector(s);

/* ─── Date & time helpers (local clock, not UTC) ──────── */
const pad = n => String(n).padStart(2, '0');
function localDate(d = new Date()) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function localTime(d = new Date()) {
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function shiftDate(iso, days) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + days);
  return localDate(dt);
}
function prettyDate(iso) {
  const today = localDate();
  if (iso === today) return 'Today';
  if (iso === shiftDate(today, -1)) return 'Yesterday';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(LOCALE[currency] || 'en-GB',
    { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
}

/* ─── Money ───────────────────────────────────────────── */
function money(n) {
  const v = Number(n) || 0;
  const s = v.toLocaleString(LOCALE[currency] || 'en-IN',
    { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return SYMBOL[currency] + s;
}
function parseMoney(text) {
  const cleaned = String(text).replace(/[^0-9.\-]/g, '');
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : NaN;
}
const escapeHtml = s => String(s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ─── Toast ───────────────────────────────────────────── */
let toastTimer = null;
function toast(msg, kind = 'success') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2800);
}

/* ══════════════════════════════════════════════════════════
   LOAD / SAVE
   ══════════════════════════════════════════════════════════ */
/* Field names vary between tools and exports. Read each field under any
   of its common aliases rather than assuming one spelling. */
const FIELD = {
  date:        ['date','txndate','transactiondate','entrydate','day','on'],
  time:        ['time','at','clock','timestamp'],
  amount:      ['amount','amt','value','spend','spent','total','price','cost','sum','debit'],
  description: ['description','desc','details','detail','item','note','notes','particulars','narration','title','merchant','label','for'],
  payment:     ['payment','paymentmode','paymentmethod','paymenttype','paymode','mode','method','type','paidby','paidvia','via','channel','instrument','tender','source']
};
const keyNorm = k => String(k).toLowerCase().replace(/[^a-z]/g, '');
function pickField(raw, kind) {
  const keys = Object.keys(raw);
  for (const name of FIELD[kind]) {
    const k = keys.find(x => keyNorm(x) === name);
    if (k != null) {
      const v = raw[k];
      if (v != null && String(v).trim() !== '') return v;
    }
  }
  return undefined;
}

/* Runtime identity only — non-enumerable, so it is never written to storage. */
let uidSeq = 0;
function tag(e) {
  if (!e._uid) Object.defineProperty(e, '_uid',
    { value: 'e' + (++uidSeq), enumerable: false, configurable: true });
  return e;
}
const byUid = uid => entries.find(e => e._uid === uid);

function sanitize(raw, meta) {
  if (!raw || typeof raw !== 'object') return null;
  const date = normDate(pickField(raw, 'date'));
  const amount = parseMoney(pickField(raw, 'amount'));
  if (!date || !Number.isFinite(amount) || amount <= 0) return null;

  const pay = normPayment(pickField(raw, 'payment'));
  if (meta && pay.assumed) meta.assumed++;

  // Keep every original field. Only the five known ones are normalised.
  const out = Object.assign({}, raw);
  out.date = date;
  out.time = normTime(pickField(raw, 'time')) || '00:00';
  out.amount = Math.round(amount * 100) / 100;
  out.description = String(pickField(raw, 'description') || '').trim().slice(0, 120) || 'Unlabelled';
  out.payment = pay.value;
  return out;
}

/* Returns { value, assumed }. `assumed` is true when nothing in the record
   said how it was paid — the caller reports that rather than hiding it. */
function normPayment(v) {
  const s = String(v == null ? '' : v).toLowerCase().trim();
  if (!s) return { value: 'upi', assumed: true };
  if (/upi|online|digital|net.?bank|g(oogle)?.?pay|phonepe|paytm|bhim|card|swipe|neft|imps|rtgs|transfer|wallet|bank/.test(s))
    return { value: 'upi', assumed: false };
  if (/cash|currency|note|hand|physical/.test(s))
    return { value: 'cash', assumed: false };
  return { value: 'upi', assumed: true };
}
function normDate(v) {
  if (v == null) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return isoOf(m[1], m[2], m[3]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);   // DD/MM/YYYY
  if (m) return isoOf(m[3], m[2], m[1]);
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : localDate(d);
}
function isoOf(y, m, d) {
  const yy = Number(y), mm = Number(m), dd = Number(d);
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  return yy + '-' + pad(mm) + '-' + pad(dd);
}
function normTime(v) {
  if (v == null) return null;
  const m = String(v).trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?/i);
  if (!m) return null;
  let h = Number(m[1]);
  const mi = Number(m[2]);
  const ap = m[3] && m[3].toLowerCase();
  if (ap === 'pm' && h < 12) h += 12;
  if (ap === 'am' && h === 12) h = 0;
  if (h > 23 || mi > 59) return null;
  return pad(h) + ':' + pad(mi);
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY_ENTRIES) || '[]');
    entries = Array.isArray(raw)
      ? raw.map(r => sanitize(r)).filter(Boolean).map(tag) : [];
  } catch (e) {
    entries = [];
    toast('Stored entries could not be read', 'error');
  }
  const c = localStorage.getItem(KEY_CURRENCY);
  if (c && SYMBOL[c]) currency = c;
  sortEntries();
}
function save() {
  sortEntries();
  try {
    localStorage.setItem(KEY_ENTRIES, JSON.stringify(entries));
  } catch (e) {
    toast('Storage is full — export a backup', 'error');
  }
}
function sortEntries() {
  entries.sort((a, b) =>
    b.date.localeCompare(a.date) || b.time.localeCompare(a.time));
}

/* ══════════════════════════════════════════════════════════
   METRICS
   ══════════════════════════════════════════════════════════ */
function renderMetrics() {
  const today = localDate();
  const yest  = shiftDate(today, -1);
  const month = today.slice(0, 7);

  const todays = entries.filter(e => e.date === today);
  const cash = todays.filter(e => e.payment === 'cash').reduce((s, e) => s + e.amount, 0);
  const upi  = todays.filter(e => e.payment === 'upi').reduce((s, e) => s + e.amount, 0);
  const monthRows = entries.filter(e => e.date.startsWith(month));
  const yestRows  = entries.filter(e => e.date === yest);
  const monthTotal = monthRows.reduce((s, e) => s + e.amount, 0);
  const yestTotal  = yestRows.reduce((s, e) => s + e.amount, 0);
  const largest    = todays.reduce((m, e) => Math.max(m, e.amount), 0);

  const plural = n => n + (n === 1 ? ' txn' : ' txns');
  $('#labelMonth').textContent =
    'This Month' + (monthRows.length ? ' · ' + plural(monthRows.length) : '');
  $('#labelYesterday').textContent =
    'Yesterday' + (yestRows.length ? ' · ' + plural(yestRows.length) : '');

  $('#metricCash').textContent      = todays.length ? money(cash) : '—';
  $('#metricUpi').textContent       = todays.length ? money(upi) : '—';
  $('#metricTxnCount').textContent  = todays.length || '—';
  $('#metricMonth').textContent     = monthTotal ? money(monthTotal) : '—';
  $('#metricYesterday').textContent = yestTotal ? money(yestTotal) : '—';
  $('#metricLargest').textContent   = largest ? money(largest) : '—';
}

/* ══════════════════════════════════════════════════════════
   ENTRIES
   ══════════════════════════════════════════════════════════ */
function visible() {
  return filter === 'all' ? entries : entries.filter(e => e.payment === filter);
}

function renderEntries() {
  const list = $('#entriesList');
  const rows = visible();

  $('#entryCount').textContent =
    rows.length + (rows.length === 1 ? ' record' : ' records');

  if (!rows.length) {
    list.innerHTML = entries.length
      ? `<div class="empty-state">
           <div class="empty-icon"><i class="fa-solid fa-filter-circle-xmark"></i></div>
           <p>Nothing on this filter</p>
           <span>Switch to All to see every record</span>
         </div>`
      : `<div class="empty-state">
           <div class="empty-icon"><i class="fa-solid fa-receipt"></i></div>
           <p>The ledger is empty</p>
           <span>Record a spend above, or import a file</span>
         </div>`;
    return;
  }

  const groups = new Map();
  rows.forEach(e => {
    if (!groups.has(e.date)) groups.set(e.date, []);
    groups.get(e.date).push(e);
  });

  let html = '';
  groups.forEach((items, date) => {
    const dayTotal = items.reduce((s, e) => s + e.amount, 0);
    html += `<div class="date-group">
      <div class="date-group-label">
        <span>${escapeHtml(prettyDate(date))}</span>
        <span class="date-group-total">${items.length} · ${escapeHtml(money(dayTotal))}</span>
      </div>`;
    items.forEach(e => {
      const icon = e.payment === 'cash'
        ? 'fa-money-bill-wave' : 'fa-mobile-screen-button';
      html += `<div class="entry-item" data-uid="${e._uid}">
        <div class="pay-badge ${e.payment}" role="button" tabindex="0"
             title="Switch between cash and UPI"><i class="fa-solid ${icon}"></i><span class="badge-swap"><i class="fa-solid fa-right-left"></i></span></div>
        <div class="entry-body">
          <div class="entry-desc">
            <span class="editable-field" contenteditable="true" data-edit="description"
                  role="textbox" aria-label="Description">${escapeHtml(e.description)}</span><i class="fa-solid fa-pencil edit-hint"></i>
          </div>
          <div class="entry-meta">
            <span class="editable-field editable-time" contenteditable="true" data-edit="time"
                  role="textbox" aria-label="Time">${escapeHtml(e.time)}</span>
            · ${e.payment.toUpperCase()}
          </div>
        </div>
        <span class="editable-field editable-amount" contenteditable="true" data-edit="amount"
              role="textbox" aria-label="Amount">${escapeHtml(money(e.amount))}</span>
        <button type="button" class="delete-btn" data-delete="${e._uid}" aria-label="Delete entry">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>`;
    });
    html += `</div>`;
  });
  list.innerHTML = html;
}

function renderFilterSummary() {
  const box = $('#filterSummary');
  if (filter === 'all') { box.classList.remove('visible'); return; }

  const rows = visible();
  const total = rows.reduce((s, e) => s + e.amount, 0);
  const grand = entries.reduce((s, e) => s + e.amount, 0);
  const cash = filter === 'cash';

  $('#fsHeader').className = 'fs-header ' + (cash ? 'cash-theme' : 'upi-theme');
  $('#fsIcon').innerHTML = `<i class="fa-solid ${cash ? 'fa-money-bill-wave' : 'fa-mobile-screen-button'}"></i>`;
  $('#fsTitle').textContent = cash ? 'Cash' : 'UPI';
  $('#fsSubtitle').textContent = 'All records';
  $('#fsTotal').textContent = money(total);
  $('#fsTotal').className = 'fs-stat-value ' + (cash ? 'highlight-cash' : 'highlight-upi');
  $('#fsCount').textContent = rows.length;
  $('#fsShare').textContent = grand ? Math.round(total / grand * 100) + '%' : '—';
  box.classList.add('visible');
}

function render() {
  renderMetrics();
  renderEntries();
  renderFilterSummary();
}

/* ══════════════════════════════════════════════════════════
   ADD / EDIT / DELETE
   ══════════════════════════════════════════════════════════ */
function addEntry() {
  const amount = Number($('#amount').value);
  if (!Number.isFinite(amount) || amount <= 0) {
    toast('Enter an amount above zero', 'error');
    $('#amount').focus();
    return;
  }
  const entry = sanitize({
    date: $('#date').value || localDate(),
    time: $('#time').value || localTime(),
    amount,
    description: $('#description').value || 'Unlabelled',
    payment
  });
  if (!entry) { toast('That entry could not be read', 'error'); return; }

  entries.push(tag(entry));
  save();
  render();
  toast('Added ' + money(entry.amount));

  $('#amount').value = '';
  $('#description').value = '';
  $('#time').value = localTime();
  $('#amount').focus();
}

function commitEdit(el) {
  const item = el.closest('.entry-item');
  if (!item) return;
  const e = byUid(item.dataset.uid);
  if (!e) return;                       // row was deleted mid-edit
  const field = el.dataset.edit;
  const text = el.textContent.trim();

  if (field === 'amount') {
    const n = parseMoney(text);
    if (!Number.isFinite(n) || n <= 0) { toast('Amount must be above zero', 'error'); render(); return; }
    const v = Math.round(n * 100) / 100;
    if (v === e.amount) { el.textContent = money(e.amount); return; }
    e.amount = v;
  } else if (field === 'time') {
    const t = normTime(text);
    if (!t) { toast('Time needs to look like 09:15', 'error'); render(); return; }
    if (t === e.time) { el.textContent = e.time; return; }
    e.time = t;
  } else {
    const d = text.slice(0, 120) || 'Unlabelled';
    if (d === e.description) { el.textContent = e.description; return; }
    e.description = d;
  }
  save();
  render();
  toast('Updated');
}

/* A record may carry its mode under several names (payment, paymentType…).
   Write the new value to every one present, or they drift apart and the
   next reader picks the stale one. */
function setPayment(entry, value) {
  entry.payment = value;
  Object.keys(entry).forEach(k => {
    if (k !== 'payment' && FIELD.payment.includes(keyNorm(k))) entry[k] = value;
  });
}

function togglePayment(uid) {
  const e = byUid(uid);
  if (!e) return;
  setPayment(e, e.payment === 'cash' ? 'upi' : 'cash');
  save();
  render();
  toast('Marked as ' + e.payment.toUpperCase());
}

function deleteEntry(uid) {
  const i = entries.findIndex(e => e._uid === uid);
  if (i < 0) return;
  const e = entries[i];
  entries.splice(i, 1);
  save();
  render();
  toast('Deleted ' + money(e.amount));
}

/* ══════════════════════════════════════════════════════════
   EXPORT
   ══════════════════════════════════════════════════════════ */
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/* Written under both names: `payment` for this build, `paymentType` for the
   original ledger and anything else that reads that spelling. A file that
   names the mode only one way is a file that loses it on the next import. */
function exportRows() {
  return entries.map(e => {
    const out = Object.assign({}, e);
    out.payment = e.payment;
    out.paymentType = e.payment;
    return out;
  });
}
function exportJSON() {
  if (!entries.length) { toast('Nothing to export yet', 'error'); return; }
  const payload = {
    meta: { tool: 'Spend Ledger', version: 'v1', exportedAt: new Date().toISOString(), count: entries.length },
    currency,
    entries: exportRows()
  };
  download(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }),
    `spend-ledger-${localDate()}.json`);
  toast(`Exported ${entries.length} entries`);
}
const csvCell = v => {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function exportCSV() {
  if (!entries.length) { toast('Nothing to export yet', 'error'); return; }
  const rows = [['date', 'time', 'description', 'amount', 'payment', 'paymentType']];
  entries.forEach(e => rows.push([e.date, e.time, e.description, e.amount, e.payment, e.payment]));
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\n');
  download(new Blob([csv], { type: 'text/csv' }), `spend-ledger-${localDate()}.csv`);
  toast(`Exported ${entries.length} entries`);
}

/* ══════════════════════════════════════════════════════════
   IMPORT — JSON or CSV, merged with duplicate protection
   ══════════════════════════════════════════════════════════ */

/* A duplicate is a match on date, time, amount and description — the four
   facts of the transaction. Payment mode is deliberately excluded: if the
   file disagrees with the ledger about cash vs UPI, that is the same
   transaction recorded wrongly, and the file corrects it. Matching stays
   count-aware, so two identical ₹20 chai in the file survive as two. */
const coreFP = e =>
  [e.date, e.time, e.amount.toFixed(2), e.description.toLowerCase()].join('|');

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else quoted = false;
      } else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function rowsFromCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { rows: [], error: 'The file has no rows' };

  const head = rows[0].map(h => keyNorm(h));
  const find = kind => {
    let i = head.findIndex(h => FIELD[kind].includes(h));        // exact alias
    if (i < 0) i = head.findIndex(h => FIELD[kind].some(n => h.includes(n)));
    return i;
  };
  let idx = {
    date: find('date'), time: find('time'),
    description: find('description'), amount: find('amount'),
    payment: find('payment')
  };
  let body = rows.slice(1);

  // No recognisable header — assume date, time, description, amount, payment
  if (idx.date < 0 && idx.amount < 0) {
    idx = { date: 0, time: 1, description: 2, amount: 3, payment: 4 };
    body = rows;
  }
  const pick = (r, i) => (i >= 0 && i < r.length ? r[i] : '');
  return {
    rows: body.map(r => ({
      date: pick(r, idx.date),
      time: pick(r, idx.time),
      description: pick(r, idx.description),
      amount: pick(r, idx.amount),
      payment: pick(r, idx.payment)
    }))
  };
}

function rowsFromJSON(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { return { rows: [], error: 'That file is not valid JSON' }; }

  let list = null, cur = null;
  if (Array.isArray(parsed)) list = parsed;
  else if (parsed && typeof parsed === 'object') {
    list = parsed.entries || parsed.spends || parsed.data || null;
    if (parsed.currency && SYMBOL[parsed.currency]) cur = parsed.currency;
  }
  if (!Array.isArray(list)) return { rows: [], error: 'No entries found in that file' };
  return { rows: list, currency: cur };
}

function importFile(file) {
  if (!file) return;
  const isCSV = /\.csv$/i.test(file.name) || file.type === 'text/csv';
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file', 'error');
  reader.onload = () => {
    const text = String(reader.result || '');
    const parsed = isCSV ? rowsFromCSV(text) : rowsFromJSON(text);
    if (parsed.error) { toast(parsed.error, 'error'); return; }
    if (!parsed.rows.length) { toast('That file holds no rows', 'error'); return; }

    const clean = [], rejected = [], meta = { assumed: 0 };
    parsed.rows.forEach((raw, n) => {
      const e = sanitize(raw, meta);
      if (e) clean.push(e);
      else rejected.push(`row ${n + 1}: ${describeReject(raw)}`);
    });

    if (!clean.length) {
      showReport('Nothing imported', [
        { text: `<b>0</b> of ${parsed.rows.length} rows were usable`, cls: 'bad' }
      ], rejected, true);
      toast('No usable rows in that file', 'error');
      return;
    }

    undoState = entries.map(e => Object.assign({}, e));

    const queues = new Map();
    entries.forEach(e => {
      const f = coreFP(e);
      if (!queues.has(f)) queues.set(f, []);
      queues.get(f).push(e);
    });

    let added = 0, skipped = 0, corrected = 0;
    clean.forEach(e => {
      const q = queues.get(coreFP(e));
      const match = q && q.length ? q.shift() : null;
      if (match) {
        if (match.payment !== e.payment) { setPayment(match, e.payment); corrected++; }
        else skipped++;
        return;
      }
      entries.push(tag(e));
      added++;
    });

    if (parsed.currency && parsed.currency !== currency) {
      currency = parsed.currency;
      localStorage.setItem(KEY_CURRENCY, currency);
      $('#currency').value = currency;
    }

    save();
    render();
    $('#undoBtn').hidden = false;

    const lines = [{ text: `<b>${added}</b> added from ${escapeHtml(file.name)}` }];
    if (corrected) lines.push({ text: `<b>${corrected}</b> already present, payment mode corrected from the file` });
    if (skipped)   lines.push({ text: `<b>${skipped}</b> skipped as already present`, cls: 'skip' });
    if (meta.assumed) lines.push({ text: `<b>${meta.assumed}</b> rows said nothing about how they were paid — recorded as UPI. Tap a badge to switch one to cash.`, cls: 'skip' });
    if (rejected.length) lines.push({ text: `<b>${rejected.length}</b> rejected as unreadable`, cls: 'bad' });
    showReport((added || corrected) ? 'Import merged' : 'Nothing new to add',
      lines, rejected, !(added || corrected));

    toast(added ? `Imported ${added} entries`
      : corrected ? `Corrected ${corrected} entries`
      : 'Every row was already here');
  };
  reader.readAsText(file);
}

function describeReject(raw) {
  if (!raw || typeof raw !== 'object') return 'not a record';
  const d = pickField(raw, 'date');
  if (!normDate(d)) return `unreadable date "${String(d || '').slice(0, 20)}"`;
  const n = parseMoney(pickField(raw, 'amount'));
  if (!Number.isFinite(n)) return 'unreadable amount';
  if (n <= 0) return 'amount is zero or negative';
  return 'incomplete record';
}

function showReport(title, lines, detail, warn) {
  $('#irTitle').textContent = title;
  $('#irLines').innerHTML = lines
    .map(l => `<div class="ir-line ${l.cls || ''}">${l.text}</div>`).join('');
  const d = $('#irDetail');
  if (detail && detail.length) {
    d.textContent = detail.slice(0, 40).join('  ·  ') +
      (detail.length > 40 ? `  ·  …and ${detail.length - 40} more` : '');
    d.hidden = false;
  } else d.hidden = true;
  const box = $('#importReport');
  box.className = 'import-report' + (warn ? ' warn' : '');
  box.hidden = false;
}

function undoImport() {
  if (!undoState) return;
  entries = undoState.map(tag);
  undoState = null;
  save();
  render();
  $('#undoBtn').hidden = true;
  $('#importReport').hidden = true;
  toast('Import undone');
}

function statementModel() {
  const rows = visible().slice().sort((a, b) =>
    a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  const total = rows.reduce((s, e) => s + e.amount, 0);
  const cash  = rows.filter(e => e.payment === 'cash').reduce((s, e) => s + e.amount, 0);
  const upi   = total - cash;
  const days  = [...new Set(rows.map(e => e.date))];
  return {
    rows, total, cash, upi, days,
    from: days[0] || null, to: days[days.length - 1] || null,
    perDay: days.length ? total / days.length : 0,
    scope: filter === 'all' ? 'All payment modes' : (filter === 'cash' ? 'Cash only' : 'UPI only')
  };
}

function statementMarkup(m) {
  const fmtDay = iso => {
    const [y, mo, d] = iso.split('-').map(Number);
    return new Date(y, mo - 1, d).toLocaleDateString('en-GB',
      { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  };
  const span = m.from
    ? (m.from === m.to ? fmtDay(m.from) : fmtDay(m.from) + ' — ' + fmtDay(m.to))
    : 'No records';

  let body = '';
  m.days.forEach(day => {
    const items = m.rows.filter(e => e.date === day);
    const sub = items.reduce((s, e) => s + e.amount, 0);
    body += `<div class="stmt-day"><div class="stmt-day-h">
      <b>${escapeHtml(fmtDay(day))}</b>
      <span>${items.length} · ${escapeHtml(money(sub))}</span></div>`;
    items.forEach(e => {
      body += `<div class="stmt-row">
        <span class="t">${escapeHtml(e.time)}</span>
        <span class="d">${escapeHtml(e.description)}</span>
        <span class="m ${e.payment}">${e.payment.toUpperCase()}</span>
        <span class="a">${escapeHtml(money(e.amount))}</span></div>`;
    });
    body += `</div>`;
  });
  if (!m.rows.length) body = `<p class="stmt-eyebrow">Nothing recorded in this selection.</p>`;

  return `<div class="stmt-head">
      <h1>Spending Statement</h1>
      <div class="period">${escapeHtml(span)}</div>
      <div class="issued">Issued ${escapeHtml(new Date().toLocaleString('en-GB'))} · ${escapeHtml(m.scope)}</div>
    </div>
    <div class="stmt-sum">
      <div><div class="v">${escapeHtml(money(m.total))}</div><div class="l">Total</div></div>
      <div><div class="v">${m.rows.length}</div><div class="l">Entries</div></div>
      <div class="cash"><div class="v">${escapeHtml(money(m.cash))}</div><div class="l">Cash</div></div>
      <div class="upi"><div class="v">${escapeHtml(money(m.upi))}</div><div class="l">UPI</div></div>
    </div>
    <div class="stmt-body">
      <p class="stmt-eyebrow">${m.days.length} day${m.days.length === 1 ? '' : 's'} · ${escapeHtml(money(m.perDay))} average per recorded day</p>
      ${body}
      <div class="stmt-note">
        Prepared from the Spend Ledger at spend.vipulanand.in. Amounts in ${escapeHtml(currency)}.<br>
        This page carries its own data. Send it to an AI assistant and say <b>g</b> for the analysis described inside it.
      </div>
    </div>`;
}

function openStatement() {
  const m = statementModel();
  $('#stmtPage').innerHTML = statementMarkup(m);
  $('#stmtScope').textContent = m.scope + ' · ' + m.rows.length + ' entries';
  $('#stmtOverlay').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeStatement() {
  $('#stmtOverlay').hidden = true;
  document.body.style.overflow = '';
}

/* The analysis brief travels with the file. It is a request to whoever
   opens it, not a command — an assistant is free to ignore it. */
const ANALYSIS_BRIEF = `
ANALYSIS BRIEF — for an AI assistant opening this file

This is a personal daily spending statement. The full dataset is embedded
below as a JSON block with the id "ledger-data". Each entry has date, time,
amount, description and payment (cash or upi). Amounts are in the currency
named in the JSON. This is one person's household spending, shared by them
deliberately for analysis.

If the person sends this file and says only "g", they are asking for:

  1. Period summary — total, entry count, days covered, average per
     recorded day, and the cash / UPI split in both amount and count.
  2. Where the money went — group the descriptions into sensible themes
     (food, fuel, groceries, household help, health, other). Say plainly
     which themes you had to guess at.
  3. Shape of the spending — the largest few entries, any day that stands
     well above the rest, and whether spending clusters on particular days

Hold to these: quote figures from the embedded data rather than the

`;

/* ══════════════════════════════════════════════════════════
   WIRING
   ══════════════════════════════════════════════════════════ */
function bind() {
  $('#addBtn').addEventListener('click', addEntry);

  document.querySelectorAll('.pay-btn').forEach(b => {
    b.addEventListener('click', () => {
      payment = b.dataset.pay;
      document.querySelectorAll('.pay-btn').forEach(x =>
        x.classList.toggle('active', x === b));
    });
  });

  ['#amount', '#description'].forEach(sel => {
    $(sel).addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addEntry(); }
    });
  });

  document.querySelectorAll('.filter-btn').forEach(b => {
    b.addEventListener('click', () => {
      filter = b.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(x => {
        x.className = 'filter-btn' +
          (x.dataset.filter === filter ? ' active-' + filter : '');
      });
      render();
    });
  });

  $('#currency').addEventListener('change', e => {
    currency = e.target.value;
    localStorage.setItem(KEY_CURRENCY, currency);
    render();
    toast('Showing amounts in ' + currency);
  });

  const list = $('#entriesList');
  /* Touch, mouse and keyboard all reach this. Listening on one event family
     only is how a control ends up working on desktop and dead on a phone.
     The guard stops one physical tap counting as several events. */
  let lastKey = '', lastAt = 0;
  const act = e => {
    const del = e.target.closest('[data-delete]');
    const badge = del ? null : e.target.closest('.pay-badge');
    if (!del && !badge) return false;
    const row = e.target.closest('.entry-item');
    if (!row) return false;
    const key = (del ? 'del:' : 'pay:') + row.dataset.uid;
    if (key === lastKey && Date.now() - lastAt < 400) return true;   // same gesture
    lastKey = key; lastAt = Date.now();
    if (del) deleteEntry(row.dataset.uid);
    else togglePayment(row.dataset.uid);
    return true;
  };
  const handle = e => { if (act(e)) e.preventDefault(); };
  list.addEventListener('pointerdown', handle);
  list.addEventListener('mousedown', handle);
  list.addEventListener('click', handle);
  list.addEventListener('keydown', e => {
    const hit = e.target.closest('[data-delete], .pay-badge');
    if (hit && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(e); }
  });
  list.addEventListener('blur', e => {
    if (e.target.dataset && e.target.dataset.edit) commitEdit(e.target);
  }, true);
  list.addEventListener('keydown', e => {
    if (!e.target.dataset || !e.target.dataset.edit) return;
    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); render(); }
  });

  $('#exportJsonBtn').addEventListener('click', exportJSON);
  $('#exportCsvBtn').addEventListener('click', exportCSV);
  $('#importBtn').addEventListener('click', () => $('#importFileInput').click());
  $('#importFileInput').addEventListener('change', e => {
    importFile(e.target.files[0]);
    e.target.value = '';
  });
  $('#statementBtn').addEventListener('click', openStatement);
  $('#stmtClose').addEventListener('click', closeStatement);
  $('#stmtPrint').addEventListener('click', () => window.print());
  $('#stmtDownload').addEventListener('click', downloadStatement);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#stmtOverlay').hidden) closeStatement();
  });
  $('#undoBtn').addEventListener('click', undoImport);
  $('#irClose').addEventListener('click', () => { $('#importReport').hidden = true; });

  /* Drag a file anywhere on the page */
  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    e.preventDefault();
    if (++dragDepth === 1) document.body.classList.add('dropping');
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', () => {
    if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dropping'); }
  });
  window.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dropping');
    if (e.dataTransfer && e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]);
  });

  /* Another tab wrote to the ledger */
  window.addEventListener('storage', e => {
    if (e.key === KEY_ENTRIES) { load(); render(); }
  });
}

function init() {
  const st = document.createElement('style');
  st.textContent = STMT_CSS;
  document.head.appendChild(st);
  load();
  $('#currency').value = currency;
  $('#date').value = localDate();
  $('#time').value = localTime();
  bind();
  render();
}
init();
</script>
</body>
</html>
